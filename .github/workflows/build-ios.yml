name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install && cd ios && pod install

      - name: Build (no code signing)
        run: |
          cd ios
          xcodebuild \
            -workspace HeartratePro.xcworkspace \
            -scheme HeartratePro \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeartratePro.app Payload/
          zip -qry HeartratePro-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HeartratePro-unsigned-ipa
          path: HeartratePro-unsigned.ipa
