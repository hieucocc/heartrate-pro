name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        # Release: standalone app with bundled JS.
        # Debug: expo-dev-client, loads JS from your PC (no rebuild for JS edits).
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install && cd ios && pod install

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: derived-${{ matrix.configuration }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: derived-${{ matrix.configuration }}-

      - name: Build (no code signing)
        run: |
          cd ios
          xcodebuild \
            -workspace HeartratePro.xcworkspace \
            -scheme HeartratePro \
            -configuration ${{ matrix.configuration }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/${{ matrix.configuration }}-iphoneos/HeartratePro.app Payload/
          zip -qry HeartratePro-${{ matrix.configuration }}-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HeartratePro-${{ matrix.configuration }}-unsigned-ipa
          path: HeartratePro-${{ matrix.configuration }}-unsigned.ipa
